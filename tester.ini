; Smoke test: does the engine run end to end on real ticks and produce
; a report. Not an edge test — June to August is ~58 trading days, which
; at one trade per day is ~58 trades. Read it for "did it behave", not
; for "is it profitable".
;
; Run:  cd <terminal dir> && wine terminal64.exe /portable /config:tester.ini
; Note: MT5 refuses a second instance on the same data directory. Close
; the GUI terminal first, or run this from the GUI tester instead.

[Tester]
Expert=ORB
Symbol=XAUUSD
Period=M1
Model=4                  ; 4 = every tick based on real ticks
FromDate=2024.01.01
ToDate=2026.08.20
Deposit=10000
Currency=USD
Leverage=1:100
Optimization=0           ; single pass
Visual=0
Report=orb_range_study
ReplaceReport=1
ShutdownTerminal=1

[TesterInputs]
; Session — Asia open, 00:00 UTC, 15 minute range, M1 signal bars.
; Tokyo 09:00 is the same instant and never shifts, since Japan has no
; DST. Either setting works; UTC is the one that was asked for.
InpTimeZone=0
InpStartHour=0
InpStartMinute=0
InpRangeMinutes=15
InpSignalTF=1
InpNoEntryAfterMin=15
InpForceCloseMin=360
InpMaxHoldMinutes=60
                         ; 90 tested 0.013R better -- inside the error bar, 2 trades
                         ; out of 119. Not a real difference; 60 is the rounder rule
                         ; ForceCloseMin stays 360 as a backstop only -- it counts
                         ; from the range close, so matching it to 90 would cut
                         ; late entries short

; Broker time — +3 measured Aug 2026, so +2 winter.
; InpFollowsUSDST is still unverified; irrelevant for a June-August run,
; both rulesets agree across that whole window.
InpWinterOffset=2
InpFollowsUSDST=true

; Entry
InpEntryMode=0           ; 0 market on close, 1 stop at level, 2 limit retest
InpMaxTradesPerDay=1
InpMaxSpreadPoints=0
InpMinRangePoints=0
InpMaxRangePoints=0
InpRangeLookback=0
                         ; is inside its own error bar (t = 0.56 / 0.68 / 1.00) and
                         ; passes per year drop 11.2 -> 3.4. The filter earns its
                         ; keep only in 2024-25, which 2026-only selection discards.
                         ; Set to 20 with ratio 1.50 if you want regime insurance:
                         ; that turns all three years positive (+0.317/+0.059/+0.645)
InpMinRangeRatio=1.25    ; today's range must be >= 1.25x the median of those
InpMinClosePos=0.25
InpTradeMon=true
InpTradeTue=true
InpTradeWed=true
InpTradeThu=true
; Friday off: only losing day of the week -- 20.8% WR, -0.241 EV
InpTradeFri=false

; Stops
InpSLMode=0              ; 0 percent of range, 1 fixed points
InpSLPercentOfRange=50
InpTPMode=0              ; 0 RR, 1 fixed points, 2 range multiple, 3 none
InpRR=2.0
InpStopMoveAtR=0.5
InpStopMoveToR=-0.5

; Risk
InpLotMode=1             ; 0 fixed, 1 risk percent
InpRiskPercent=2.0
InpMagic=20260821
