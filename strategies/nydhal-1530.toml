# Nydhal's spec: the M15 candle 15:30-15:45 UTC+2 (13:30-13:45 UTC) on gold,
# broken by a closing M15 candle, entries open until 17:00 UTC+2.
#
# One change from what he wrote: the stop goes at the FAR SIDE of the box, not
# at the break candle's low. Measured on 2026, that is +0.074 R a trade against
# +0.025 R -- the tighter stop makes a fixed cost a bigger share of the risk.
name = "nydhal-1530"

[session]
tz               = "UTC"
start            = "13:30"      # 15:30 UTC+2
range_min        = 15           # the single M15 candle, so the box closes 13:44
entry_window_min = 75           # a break must close by 15:00 UTC = 17:00 UTC+2
hold_min         = 60          # measured, not a data limit -- see [notes]
signal_tf        = "M15"        # the break counts when an M15 candle CLOSES outside
entry_mode       = "market_on_close"

[rules]
rr              = 1.2           # measured optimum; his 1R earns +0.095 R against +0.118
sl_pct_of_range = 100.0         # the far side of the box
stop_move_at_r  = 0             # off
half_filter     = false         # he did not ask for it: either half may break
direction       = "both"
days            = ["Mon", "Tue", "Wed", "Thu", "Fri"]

[risk]
per_trade = 2.5

[dates]
from = 2026-01-01
to   = "today"

[report]
benchmark = "fundingpips-1step-flex"
output    = "nydhal-1530.html"
title     = "ORB 15:30 UTC+2 — Gold, 1.2R"
h1        = "The 15:30 Candle"
h1_em     = "on Gold, at 1.2R"
short     = "ORB 15:30 UTC+2 — gold, 1.2R."
lede      = """One trade a session, Monday to Friday, from the single M15 candle that \
closes at 15:30 UTC+2. Break either way, stop at the far side of the box, target 1.2R, \
flat after an hour."""

[notes]
why = [
  ["15:30 UTC+2 (13:30 UTC)",
   "Nydhal's choice, not a search result. It is the same session as the existing 13:30 study, so the two are directly comparable."],
  ["One M15 candle as the box",
   "15:30 to 15:44. The high and low of that single candle are the whole range — no 15 separate M1 candles to aggregate."],
  ["M15 close to confirm the break",
   "A wick through the box does not count. Roughly half of all breaks happen on the very first M15 candle after the box."],
  ["Entries until 17:00 UTC+2",
   "Five M15 candles. His rule 4. Breaks later than that were not tested, because the bar data runs out before a 60-minute hold would finish."],
  ["Stop at the far side of the box",
   "The one change from his spec. His rule 5 puts it at the break candle's low, which measured +0.025 R a trade against +0.074 R here. The far-side stop is roughly $22 wide against $14, and a fixed spread-and-commission is a smaller share of the bigger number: 0.031 R against 0.052 R."],
  ["Not the candle before the break",
   "His rule 6. Tested at every target and it never beat the box edge. When the break lands on the first candle it is the box edge anyway."],
  ["Market entry, on the candle's close",
   "The order goes in the moment the M15 candle closes beyond the box; the fill is the next minute's open. The alternative — a limit resting back at the box edge — only fills 73% of the time and earns +0.053 R against +0.088 R, because the trades it misses are the ones that ran away."],
  ["1.2R target",
   "He asked for 1R, which earns +0.095 R a trade. 1.2R earns +0.118 R for the same worst losing run, so the extra 0.2R is free. 0.5R is the worst choice of all — a smaller payout meets the same fixed cost. Everything from 1.1R to 1.3R scores between +0.099 and +0.118, so read 1.2R as the middle of a plateau rather than a precise peak."],
  ["No stop move",
   "A 1R target is reached or not before a stop move at +0.5R would earn its keep."],
  ["60-minute cap",
   "Not in his spec, which runs to stop or target, and the reason the average win is +0.77R rather than +1.2R. It earns its place twice over. The bar data now reaches broker 23:59, so caps up to five hours are testable: expectancy peaks at 60-75 minutes (+0.108 R) and falls to +0.077 R with no cap, while the worst losing run more than doubles from -3.02 R to -6.70 R — 16.8% at 2.5% risk, past the 12% limit. Letting a trade run does push the averages toward the full 1.2R and 1.0R, but it pushes the money the other way: after an hour the break has spent itself and the position drifts back. Even at five hours, 37 of 157 trades never reach either level."],
  ["Either direction",
   "His rules 1 and 2: the first M15 candle to close outside the box is taken whichever way it broke. 83 longs, 74 shorts."],
  ["2026 only — read this",
   "The same rules over 2024-2026 lose money on all 32 stop-and-target settings tested. Gold is far more expensive in 2026, so the box is wider in dollars and a fixed cost matters less. That is the whole reason this year looks different, and it is the main reason to distrust the numbers below."],
  ["Evidence strength — and this",
   "The best t-statistic across every variant is about +1.3. Anything under +2 is indistinguishable from luck. On this many trades the result is a hint, not a finding."],
]
