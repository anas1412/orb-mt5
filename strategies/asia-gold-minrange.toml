# The published Asia configuration with ONE rule added: skip the session when the
# 00:00-00:14 range is narrower than 0.14% of gold's price. Everything else is
# identical to asia-gold.toml, so the two reports differ by that rule alone.
#
# Why 0.14%: pooling 2024-2026, the narrowest quarter of Asia sessions won 14.7%
# of the time for -0.474 R and the widest quarter won 44.9% for +0.381 R. The
# median range was 0.079% of price in 2024, 0.142% in 2025 and 0.261% in 2026 --
# so the years the strategy lost are the years the box was too small to pay for
# itself, and a points threshold would have drifted while a percent one does not.
name = "asia-gold-minrange"

[rules]
min_range_pct = 0.14

[report]
benchmark = "fundingpips-1step-flex"
output    = "asia-minrange.html"
title     = "ORB Asia — Gold, min range 0.14%"
h1        = "The Asia Opening Range"
h1_em     = "on Gold, narrow days skipped"
short     = "ORB Asia — gold, min range 0.14%."
lede      = """One trade a day, Monday to Thursday, decided in the fifteen minutes after \
midnight UTC — and only when that fifteen-minute box is at least 0.14% of gold's price wide. \
Narrow sessions are skipped before entry, not exited early."""
variant          = "Min range 0.14%"
variant_alt      = "Filter off"
variant_alt_href = "index.html"
